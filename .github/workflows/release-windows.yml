name: Windows Release & NSIS Installer Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sparkle_app/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            blyskawica_core
            sparkle_app/src-tauri

      - name: Run Blyskawica Core Rust Tests
        run: cargo test --locked --manifest-path blyskawica_core/Cargo.toml

      - name: Install Frontend Dependencies & Run Regression Tests
        working-directory: sparkle_app
        run: |
          npm ci
          npm test

      - name: Build Standalone Tauri Desktop Application & Installers (ADR 0002)
        working-directory: sparkle_app
        run: npx tauri build

      - name: Upload Windows Installer Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Sparkle-VIBE-IDE-Windows-Installers
          path: |
            sparkle_app/src-tauri/target/release/bundle/nsis/*.exe
            sparkle_app/src-tauri/target/release/bundle/msi/*.msi
