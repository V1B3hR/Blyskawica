dataset:
  name: "mnist"
  batch_size: 128
  num_workers: 4
  shuffle: true

model:
  name: "adaptive"
  input_dim: 784
  hidden_dim: 128
  output_dim: 10
  num_nodes: 64

optimizer:
  name: "adam"
  learning_rate: 0.001
  weight_decay: 0.0001

training:
  epochs: 10
  device: "cpu"
  seed: 42
  use_amp: false
  checkpoint_dir: "checkpoints"
  save_every_n_epochs: 2
  verbose: true

evaluation:
  batch_size: 128
  output_dir: "outputs"
