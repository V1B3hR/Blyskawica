apiVersion: apps/v1
kind: Deployment
metadata:
  name: blyskawica-pinn-engine
  namespace: blyskawica-enterprise
  labels:
    app: pinn-engine
    tier: cognitive
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pinn-engine
  template:
    metadata:
      labels:
        app: pinn-engine
    spec:
      containers:
      - name: pinn-container
        image: image-registry.openshift-image-registry.svc:5000/blyskawica-enterprise/pinn-engine:latest
        imagePullPolicy: Always
        resources:
          limits:
            amd.com/gpu: "1" # Request 1 AMD Instinct/Ryzen vGPU on ROCm
            memory: 8Gi
            cpu: "4"
          requests:
            amd.com/gpu: "1"
            memory: 4Gi
            cpu: "2"
        env:
        - name: PYTHONPATH
          value: "/app"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"