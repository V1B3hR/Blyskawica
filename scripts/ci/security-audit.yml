# Security Audit & CVE Scanning Workflow for Błyskawica
# Copy or symlink to .github/workflows/security-audit.yml once PAT 'workflow' permission is enabled

name: Security Audit & CVE Scanning

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    # Run weekly every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

jobs:
  security-audit:
    name: Security Vulnerability & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Audit Dependencies (pip-audit)
        run: |
          pip-audit -r requirements.txt

      - name: Static Application Security Testing (Bandit)
        run: |
          bandit -r adaptiveneuralnetwork blyskawica_app -ll -ii

      - name: File System & Secret Scan (Trivy fs)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          hide-progress: true
          exit-code: '0'
